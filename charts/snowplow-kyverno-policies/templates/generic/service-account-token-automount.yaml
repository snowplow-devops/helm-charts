{{- $p := .Values.policies.disableServiceAccountTokenAutomount }}
{{- if $p.mutate.enabled }}
---
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: disable-automount-service-account-token
  labels:
    {{- include "snowplow-kyverno-policies.labels" . | nindent 4 }}
spec:
  matchConstraints:
    {{- include "snowplow-kyverno-policies.automountMatchConstraints" $p | nindent 4 }}

  {{- with (include "snowplow-kyverno-policies.automountMatchConditions" $p | trim) }}
  matchConditions:
    {{- . | nindent 4 }}
  {{- end }}

  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          Object{
            spec: Object.spec{
              automountServiceAccountToken: false
            }
          }
{{- end }}
{{- if $p.validate.enabled }}
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-service-account-token-automount-disabled
  labels:
    {{- include "snowplow-kyverno-policies.labels" . | nindent 4 }}
spec:
  validationActions:
    {{- toYaml (required "policies.disableServiceAccountTokenAutomount.validate.validationActions is required" $p.validate.validationActions) | nindent 4 }}
  failurePolicy: {{ $p.validate.failurePolicy }}

  evaluation:
    background:
      enabled: {{ $p.validate.background }}

  matchConstraints:
    {{- include "snowplow-kyverno-policies.automountMatchConstraints" $p | nindent 4 }}

  {{- with (include "snowplow-kyverno-policies.automountMatchConditions" $p | trim) }}
  matchConditions:
    {{- . | nindent 4 }}
  {{- end }}

  validations:
    - expression: >-
        has(object.spec.automountServiceAccountToken) &&
        object.spec.automountServiceAccountToken == false
      message: >-
        Pod must set spec.automountServiceAccountToken to false.
        {{- with $p.exemptionLabel }} Label the Pod {{ . }}: "true"
        if it genuinely needs a projected ServiceAccount token, for example
        because it calls the Kubernetes API.{{ end }}
{{- end }}
