{{- $p := .Values.policies.disableServiceAccountTokenAutomount }}
{{- /*
With checkMountedToken the validation fails any Pod that still mounts the
token. Unless the mutation removes it first, that is every Pod in scope, and
under Deny every one of them would be rejected.
*/}}
{{- if and $p.validate.enabled $p.validate.checkMountedToken (has "Deny" $p.validate.validationActions) (not (and $p.mutate.enabled $p.mutate.removeTokenVolume)) }}
{{- fail "policies.disableServiceAccountTokenAutomount.validate.checkMountedToken with validationActions Deny requires mutate.enabled and mutate.removeTokenVolume, otherwise every Pod in scope is denied" }}
{{- end }}
{{- /*
The default ServiceAccount token volume the ServiceAccount admission plugin
adds: a projected volume named kube-api-access-<random>. IRSA (aws-iam-token),
EKS Pod Identity (eks-pod-identity-token) and Azure Workload Identity
(azure-identity-token) use other names and are never matched.
*/}}
{{- $tokenVolumes := "object.spec.?volumes.orValue([]).filter(v, v.name.startsWith('kube-api-access-') && has(v.projected)).map(v, v.name)" }}
{{- if $p.mutate.enabled }}
---
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: disable-automount-service-account-token
  labels:
    {{- include "snowplow-kyverno-policies.labels" . | nindent 4 }}
spec:
  failurePolicy: {{ $p.mutate.failurePolicy }}

  matchConstraints:
    {{- include "snowplow-kyverno-policies.automountMatchConstraints" $p | nindent 4 }}

  {{- with (include "snowplow-kyverno-policies.podMatchConditions" (dict "policy" $p "root" $) | trim) }}
  matchConditions:
    {{- . | nindent 4 }}
  {{- end }}
  {{- if $p.mutate.removeTokenVolume }}

  variables:
    - name: tokenVolumes
      expression: >-
        {{ $tokenVolumes }}
  {{- end }}

  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          Object{
            spec: Object.spec{
              automountServiceAccountToken: false
            }
          }
  {{- if $p.mutate.removeTokenVolume }}
    # The ServiceAccount admission plugin runs before any webhook, so by the
    # time this policy sees the Pod the token volume and its mounts are already
    # there. Setting automountServiceAccountToken alone leaves them in place.
    # Each list is replaced with a filtered copy, and only when it contains a
    # token entry, so a Pod without the token is not patched at all.
    - patchType: JSONPatch
      jsonPatch:
        expression: >-
          (size(variables.tokenVolumes) == 0 ? [] : [
            JSONPatch{
              op: "replace",
              path: "/spec/volumes",
              value: object.spec.volumes.filter(v, !(v.name in variables.tokenVolumes))
            }
          ])
          {{- range $field := list "containers" "initContainers" "ephemeralContainers" }} +
          lists.range(size(object.spec.?{{ $field }}.orValue([]))).filter(i,
            object.spec.{{ $field }}[i].?volumeMounts.orValue([]).exists(m, m.name in variables.tokenVolumes)
          ).map(i, JSONPatch{
            op: "replace",
            path: "/spec/{{ $field }}/" + string(i) + "/volumeMounts",
            value: object.spec.{{ $field }}[i].volumeMounts.filter(m, !(m.name in variables.tokenVolumes))
          })
          {{- end }}
  {{- end }}
{{- end }}
{{- if $p.validate.enabled }}
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-service-account-token-automount-disabled
  labels:
    {{- include "snowplow-kyverno-policies.labels" . | nindent 4 }}
spec:
  validationActions:
    {{- toYaml (required "policies.disableServiceAccountTokenAutomount.validate.validationActions is required" $p.validate.validationActions) | nindent 4 }}
  failurePolicy: {{ $p.validate.failurePolicy }}

  evaluation:
    background:
      enabled: {{ $p.validate.background }}

  matchConstraints:
    {{- include "snowplow-kyverno-policies.automountMatchConstraints" $p | nindent 4 }}

  {{- with (include "snowplow-kyverno-policies.podMatchConditions" (dict "policy" $p "root" $) | trim) }}
  matchConditions:
    {{- . | nindent 4 }}
  {{- end }}
  {{- if $p.validate.checkMountedToken }}

  variables:
    - name: tokenVolumes
      expression: >-
        {{ $tokenVolumes }}
    - name: mounting
      expression: >-
        (object.spec.containers +
          object.spec.?initContainers.orValue([]) +
          object.spec.?ephemeralContainers.orValue([])
        ).filter(c,
          c.?volumeMounts.orValue([]).exists(m, m.name in variables.tokenVolumes)
        ).map(c, c.name)

  validations:
    - expression: size(variables.mounting) == 0
      message: >-
        No container may mount the default ServiceAccount token (a
        kube-api-access-* volume).
      messageExpression: >-
        'Containers ' + variables.mounting.join(', ') +
        ' mount the default ServiceAccount token (a kube-api-access-* volume).{{- with $p.exemptionLabel }} Label the Pod {{ . }}: "true" if it genuinely needs the token, for example because it calls the Kubernetes API.{{ end }}'
  {{- else }}

  validations:
    - expression: >-
        has(object.spec.automountServiceAccountToken) &&
        object.spec.automountServiceAccountToken == false
      message: >-
        Pod must set spec.automountServiceAccountToken to false.
        {{- with $p.exemptionLabel }} Label the Pod {{ . }}: "true"
        if it genuinely needs a projected ServiceAccount token, for example
        because it calls the Kubernetes API.{{ end }}
  {{- end }}
{{- end }}
