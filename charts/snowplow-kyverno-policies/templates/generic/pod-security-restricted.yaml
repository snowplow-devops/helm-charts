{{- $p := .Values.policies.podSecurityRestricted }}
{{- if $p.enabled }}
{{- $controls := list
  "disallow-host-process"
  "disallow-host-namespaces"
  "disallow-privileged-containers"
  "disallow-host-ports"
  "disallow-host-probes"
  "restrict-apparmor"
  "restrict-selinux"
  "restrict-sysctls"
  "restrict-volume-types"
  "disallow-privilege-escalation"
  "require-run-as-non-root"
  "disallow-run-as-root-user"
  "restrict-seccomp"
  "restrict-capabilities"
  "disallow-proc-mount"
}}
{{- range $control := $controls }}
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: pss-{{ $control }}
  labels:
    {{- include "snowplow-kyverno-policies.labels" $ | nindent 4 }}
spec:
  validationActions:
    {{- toYaml (required "policies.podSecurityRestricted.validationActions is required" $p.validationActions) | nindent 4 }}
  failurePolicy: {{ $p.failurePolicy }}

  evaluation:
    background:
      enabled: {{ $p.background }}

  matchConstraints:
    {{- include "snowplow-kyverno-policies.podMatchConstraints" $p | nindent 4 }}

  {{- with (include "snowplow-kyverno-policies.podMatchConditions" $p | trim) }}
  matchConditions:
    {{- . | nindent 4 }}
  {{- end }}

  variables:
    - name: allContainers
      expression: >-
        object.spec.containers +
        object.spec.?initContainers.orValue([]) +
        object.spec.?ephemeralContainers.orValue([])
    - name: securityContexts
      expression: >-
        object.spec.?securityContext.optMap(sc, [sc]).orValue([]) +
        variables.allContainers.filter(c, has(c.securityContext)).map(c, c.securityContext)
    - name: isWindows
      expression: object.spec.?os.?name.orValue('') == 'windows'
    - name: userNamespace
      expression: object.spec.?hostUsers.orValue(true) == false

  validations:
    {{- include (printf "snowplow-kyverno-policies.pss.%s" $control) $ | nindent 4 }}
{{- end }}
{{- end }}
