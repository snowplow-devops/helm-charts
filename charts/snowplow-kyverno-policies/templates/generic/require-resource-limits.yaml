{{- $p := .Values.policies.requireResourceLimits }}
{{- if $p.enabled }}
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-resource-limits
  labels:
    {{- include "snowplow-kyverno-policies.labels" . | nindent 4 }}
spec:
  validationActions:
    {{- toYaml (required "policies.requireResourceLimits.validationActions is required" $p.validationActions) | nindent 4 }}
  failurePolicy: {{ $p.failurePolicy }}

  evaluation:
    background:
      enabled: {{ $p.background }}

  matchConstraints:
    {{- include "snowplow-kyverno-policies.podMatchConstraints" $p | nindent 4 }}

  {{- with (include "snowplow-kyverno-policies.podMatchConditions" $p | trim) }}
  matchConditions:
    {{- . | nindent 4 }}
  {{- end }}

  variables:
    - name: required
      expression: {{ toJson (required "policies.requireResourceLimits.requiredLimits is required" $p.requiredLimits) | quote }}
    # has() guards throughout: a missing field is a CEL evaluation error, and
    # under failurePolicy Ignore an error admits the Pod.
    - name: allContainers
      expression: >-
        object.spec.containers +
        (has(object.spec.initContainers) ? object.spec.initContainers : [])
    - name: failing
      expression: >-
        variables.allContainers.filter(c,
          !has(c.resources) ||
          !has(c.resources.limits) ||
          !variables.required.all(r, r in c.resources.limits)
        ).map(c, c.name)

  validations:
    - expression: size(variables.failing) == 0
      message: >-
        Every container and initContainer must set resources.limits for each
        of: {{ join ", " $p.requiredLimits }}.
      messageExpression: >-
        'Containers ' + variables.failing.join(', ') +
        ' must set resources.limits for each of: ' + variables.required.join(', ') +
        '.{{- with $p.exemptionLabel }} Label the Pod {{ . }}: "true" to exempt it.{{ end }}'
{{- end }}
