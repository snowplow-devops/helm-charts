{{- $p := .Values.policies.restrictSecretMounts }}
{{- if $p.enabled }}
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restrict-secret-mounts
  labels:
    {{- include "snowplow-kyverno-policies.labels" . | nindent 4 }}
spec:
  validationActions:
    {{- toYaml (required "policies.restrictSecretMounts.validationActions is required" $p.validationActions) | nindent 4 }}
  failurePolicy: {{ $p.failurePolicy }}

  evaluation:
    background:
      enabled: {{ $p.background }}

  matchConstraints:
    {{- include "snowplow-kyverno-policies.podMatchConstraints" (dict "policy" $p "ephemeralContainers" true) | nindent 4 }}

  {{- with (include "snowplow-kyverno-policies.podMatchConditions" $p | trim) }}
  matchConditions:
    {{- . | nindent 4 }}
  {{- end }}

  # Optional chaining and has() throughout: a missing field is a CEL evaluation
  # error, which Kyverno reports as an error under Audit and turns into a
  # denial under Deny, so an unguarded expression would block compliant Pods.
  variables:
    - name: allowed
      expression: {{ toJson ($p.allowedSecrets | default list) | quote }}
    - name: allContainers
      expression: >-
        object.spec.containers +
        object.spec.?initContainers.orValue([]) +
        object.spec.?ephemeralContainers.orValue([])
    - name: volumeSecrets
      expression: >-
        object.spec.?volumes.orValue([]).filter(v, has(v.secret))
          .map(v, v.secret.?secretName.orValue(''))
    - name: projectedSecrets
      expression: >-
        object.spec.?volumes.orValue([]).filter(v, has(v.projected))
          .map(v, v.projected.?sources.orValue([]).filter(s, has(s.secret))
            .map(s, s.secret.?name.orValue(''))).flatten()
    - name: envSecrets
      expression: >-
        variables.allContainers
          .map(c, c.?env.orValue([]).filter(e, has(e.valueFrom) && has(e.valueFrom.secretKeyRef))
            .map(e, e.valueFrom.secretKeyRef.?name.orValue(''))).flatten()
    - name: envFromSecrets
      expression: >-
        variables.allContainers
          .map(c, c.?envFrom.orValue([]).filter(e, has(e.secretRef))
            .map(e, e.secretRef.?name.orValue(''))).flatten()
    - name: disallowed
      expression: >-
        (variables.volumeSecrets + variables.projectedSecrets +
         variables.envSecrets + variables.envFromSecrets)
          .distinct().filter(n, !(n in variables.allowed))

  validations:
    - expression: size(variables.disallowed) == 0
      message: >-
        Pods may only reference Secrets named in the restrict-secret-mounts
        allowlist{{ with $p.allowedSecrets }}: {{ join ", " . }}{{ end }}.
      messageExpression: >-
        'Pod references Secrets not on the allowlist: ' + variables.disallowed.join(', ') +
        '. Allowed: ' + (size(variables.allowed) == 0 ? '(none)' : variables.allowed.join(', ')) +
        '.{{- with $p.exemptionLabel }} Label the Pod {{ . }}: "true" to exempt it.{{ end }}'
{{- end }}
