# Cloud provider. Gates cloud-specific curated policies (aws|gcp|azure).
global:
  cloud: ""

# Extra labels applied to every policy and RBAC object
labels: {}

# ---------------------------------------------------------------------------
# Curated catalog of opinionated Kyverno policies.
# ---------------------------------------------------------------------------
policies:
  # AWS-only. Bridges ACK ACM Certificate CRs to ACK Route53 RecordSet CRs for
  # DNS-01 validation: on Certificate CREATE/UPDATE, once the ACK ACM controller
  # has populated status.domainValidations[], generate the validation CNAME
  # RecordSet in the hosted zone named by the Certificate annotation. The
  # generated RecordSet carries an ownerReference back to the Certificate so it
  # cascade-deletes. Requires Kyverno + the ACK ACM and Route53 controllers.
  ackAcmDnsValidation:
    enabled: false
    # Annotation on the Certificate carrying the target Route53 hosted zone ID.
    hostedZoneAnnotation: snowplow.io/hosted-zone-id
    # TTL (seconds) for the generated validation RecordSet.
    ttl: 60
    # Kyverno generate evaluation behaviour
    evaluation:
      # Generate the RecordSet on Certificate admission (CREATE/UPDATE).
      admission: true
      # Generate for Certificates that already exist when the policy is installed.
      generateExisting: true
      # Re-reconcile the generated RecordSet if it is modified or deleted.
      synchronize: true

  # Cloud-agnostic. Stops Pods mounting a ServiceAccount token they do not need,
  # in two independent modes that can be enabled together:
  #
  #   mutate   - patch Pods on CREATE to spec.automountServiceAccountToken: false
  #   validate - report (or block) Pods that do not have it set to false
  #
  # Cloud identity is unaffected: IRSA and Azure Workload Identity inject their
  # own projected token volumes, which this does not touch. In-cluster API
  # clients ARE affected - anything that talks to the Kubernetes API needs the
  # exemption label or an excluded namespace, or it will fail to authenticate.
  disableServiceAccountTokenAutomount:
    # MutatingPolicy. Admission-time only: automountServiceAccountToken is
    # immutable on a running Pod, so already-running Pods are unaffected until
    # they are recreated.
    mutate:
      enabled: false
    # ValidatingPolicy, for ongoing compliance reporting or enforcement.
    validate:
      enabled: false
      # Audit (PolicyReport only) / Warn (admission warning) / Deny (block).
      validationActions:
        - Audit
      # Ignore keeps admission working when the Kyverno webhook is unavailable.
      # Deny normally wants Fail, at the cost of a hard dependency on Kyverno.
      failurePolicy: Ignore
      # Background-scan already-running Pods into PolicyReports.
      background: true
    # Namespaces exempt from both modes, matched on the kubernetes.io/metadata.name
    # label the API server sets on every namespace. Add the namespace of any
    # controller that talks to the Kubernetes API.
    excludedNamespaces:
      - kube-system
      - kyverno
    # Pods carrying this label set to "true" are exempt from both modes. Set to
    # "" to remove the per-Pod escape hatch.
    exemptionLabel: snowplow.io/automount-service-account-token

# Data-driven families: N policies of any kyverno kind, supplied as data. The
# chart adds naming, standard labels and (for policies that act on cluster
# resources) an aggregated ClusterRole built from rbac.rules.
customPolicies: []
