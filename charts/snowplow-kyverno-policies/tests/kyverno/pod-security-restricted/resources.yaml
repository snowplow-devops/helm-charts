apiVersion: v1
kind: Pod
metadata:
  name: fail-procmount-unmasked
  namespace: default
spec:
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: app
    image: nginx
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      procMount: Unmasked
---
apiVersion: v1
kind: Pod
metadata:
  name: fail-procmount-unmasked-userns
  namespace: default
spec:
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: app
    image: nginx
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      procMount: Unmasked
  hostUsers: false
---
apiVersion: v1
kind: Pod
metadata:
  name: fail-windows-pod-runasnonroot
  namespace: default
spec:
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: app
    image: nginx
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
  os:
    name: windows
---
apiVersion: v1
kind: Pod
metadata:
  name: fail-bare-pod
  namespace: default
spec:
  containers:
  - name: app
    image: nginx
    securityContext: {}
---
apiVersion: v1
kind: Pod
metadata:
  name: fail-multi
  namespace: default
spec:
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: app
    image: nginx
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      privileged: true
  hostNetwork: true
  volumes:
  - name: h
    hostPath:
      path: /
---
apiVersion: v1
kind: Pod
metadata:
  name: skip-exempt
  namespace: default
  labels:
    snowplow.io/skip-pod-security: 'true'
spec:
  containers:
  - name: app
    image: nginx
    securityContext: {}
---
apiVersion: v1
kind: Pod
metadata:
  name: skip-excluded-namespace
  namespace: kube-system
spec:
  containers:
  - name: app
    image: nginx
    securityContext: {}
