# Pod fixtures for the pss-* policies: one compliant base Pod, then one change
# per fixture. ok-* Pods are compliant, including cases upstream Kyverno's
# pod-security-vpol policies get wrong; fail-* Pods break the control(s) listed
# for them in kyverno-test.yaml.
---
apiVersion: v1
kind: Pod
metadata:
  name: ok-base
  namespace: default
spec:
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: app
    image: nginx
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
---
apiVersion: v1
kind: Pod
metadata:
  name: ok-init-and-ephemeral
  namespace: default
spec:
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: app
    image: nginx
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
  initContainers:
  - name: init
    image: nginx
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
  ephemeralContainers:
  - name: debug
    image: busybox
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
---
apiVersion: v1
kind: Pod
metadata:
  name: ok-container-level-only
  namespace: default
spec:
