  namespace: default
spec:
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: app
    image: nginx
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
  volumes:
  - name: a
    configMap:
      name: x
  - name: b
    emptyDir: {}
  - name: c
    secret:
      secretName: x
  - name: d
    projected:
      sources: []
  - name: e
    persistentVolumeClaim:
      claimName: x
  - name: f
    downwardAPI: {}
---
apiVersion: v1
kind: Pod
