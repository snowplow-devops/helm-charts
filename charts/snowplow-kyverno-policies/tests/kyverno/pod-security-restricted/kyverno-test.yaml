# Run with scripts/kyverno-policy-test.sh, which renders policy.yaml from the
# chart first. policy.yaml is not committed.
#
# Expected results are the verdicts of Kubernetes' own Pod Security Admission
# evaluator (k8s.io/pod-security-admission, restricted level, v1.35) on each
# fixture, so a pass here means the pss-* policies agree with PSA per control.
