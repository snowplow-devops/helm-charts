# Every field carrying a "# @schema" annotation in values.yaml, set to the
# form the annotation exists to permit. Without those annotations the
# generator infers a single scalar type and each of these is rejected.
image:
  tag: 2                      # unquoted numeric tag
config:
  env:                        # inferred as null (declared but empty in values.yaml)
    HELLO: "world"
podDisruptionBudget:
  enabled: true
  minAvailable: "50%"         # documented percentage form
deployment:
  strategy:
    type: "RollingUpdate"
    rollingUpdate:
      maxUnavailable: 3       # documented integer form
      maxSurge: 5
