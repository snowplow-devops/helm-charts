# Free-form passthrough maps and keys documented only in comments. These are
# why the schema is permissive: additionalProperties:false rejects all of them.
resources:
  limits: {cpu: 500m, memory: 512Mi}
  requests: {cpu: 100m, memory: 128Mi}
persistentVolume:
  enabled: true
  storageClass: "gp3"         # commented-out in values.yaml, used in templates
podDisruptionBudget:
  enabled: true
  maxUnavailable: 1           # commented-out in values.yaml, used in templates
deployment:
  podLabels: {env: prod2}
  podAnnotations: {prometheus.io/scrape: "true"}
topologySpreadConstraints:
  foo: bar
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - {key: kubernetes.io/os, operator: In, values: [linux]}
service:
  ingress:
    ingress-0001:
      hostname: example-01.com
hooks:
  db-bootstrap:
    enabled: true
    image: postgres:alpine
    script: "echo hi"
extraObjects:
  - apiVersion: v1
    kind: ConfigMap
    metadata: {name: extra}
global:
  cloud: aws
  labels: {team: sre}
