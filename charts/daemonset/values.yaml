global:
  # -- Cloud specific bindings (options: aws, gcp, azure)
  cloud: ""

  # global labels will be applied to all resources deployed by the chart
  labels: {}

# -- Overrides the full-name given to the deployment resources (default: .Release.Name)
fullnameOverride: ""

image:
  repository: "nginx"
  tag: "latest"
  # -- Whether the repository is public
  isRepositoryPublic: true
  # -- The image pullPolicy to use
  pullPolicy: "IfNotPresent"

config:
  command: []
  #  - "/bin/sh"
  args: []
  #  - "-c"
  #  - "echo 'Environment $(hello_env)! Secret $(username).'"

  # -- Map of environment variables to use within the job
  env:
  #  hello_env: "world"

  # -- Map of secrets that will be exposed as environment variables within the job
  secrets: {}
  #  username: "password"

  # -- Deprecated, use containerSecurityContext. Map of securityContext applied to the container.
  # When non-empty it replaces containerSecurityContext entirely, so existing overrides keep their exact behaviour.
  securityContext: {}
  #  readOnlyRootFilesystem: true
  #  privileged: false
  #  capabilities:
  #    add:
  #    - NET_ADMIN

  # -- Allow pods access to host proccess information
  hostPIDAccess: false

  # -- Allow pods access to host network ()
  hostNetworkAccess: false

  # -- DNS Policy for pods (https://kubernetes.io/docs/concepts/services-networking/dns-pod-service/)
  dnsPolicy: ClusterFirst

# -- List of config maps to mount to the deployment
configMaps: []
#  - name: "volume-1"
#    mountPath: "/etc/config" # Must be unique
#    mountPropagation: None # If unset will default to 'None'
#    files: []
#      - key: "file.cfg" # Key must be unique for each file
#        contentsB64: "" # The file contents which have already been base-64 encoded
#        contentsFile: "" # The path to a local file (note: contentsB64 will take precedence if not-empty)

# -- Annotations to be applied to the daemonset
daemonsetAnnotations: {}

# -- List of host paths to mount to the deployment
hostPaths: []
#  - name: "rootfs" - required
#    path: "/" - optional
#    type: "Directory" - optional
#    mountPath: "/rootfs" - required
#    readOnly: true - optional, defaults to true
#    secretName: "secret-name" - optional
#    secretDefaultMode: 256 - optional

# -- Map of resource constraints for the service
resources: {}
#  limits:
#    cpu: 746m
#    memory: 900Mi
#  requests:
#    cpu: 400m
#    memory: 512Mi

# -- Container security context configuration
# These defaults follow kubesec.io best practices for hardened deployments.
#
# runAsUser / runAsGroup are intentionally not pinned. Different container
# images bake in different non-root USER directives, and forcing a specific
# UID can prevent the image's user from accessing its own files. The image's
# USER directive selects the runtime UID; runAsNonRoot: true still enforces
# the non-root invariant. Override per-deployment if you need a specific UID.
#
# readOnlyRootFilesystem defaults to false so existing deployments are not
# broken on upgrade; set it to true per-deployment once writable paths
# (e.g. /tmp) are mounted.
#
# Node agents that need root, host access or extra capabilities (e.g. log
# shippers, network agents) must override these, e.g. runAsNonRoot: false
# or capabilities.add. config.securityContext, when set, takes precedence.
containerSecurityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

# -- Grace period for termination of the service
terminationGracePeriodSeconds: 60

# -- Tolerations for the daemonset pods. Defaults to tolerating all taints so the
# daemonset is scheduled onto every node in the cluster, including tainted nodes
# (e.g. Karpenter-provisioned nodes). Set to [] to disable and use default scheduling.
tolerations:
  - operator: Exists

# -- Node selector for constraining the daemonset to specific nodes
nodeSelector: {}

# -- Affinity rules for the daemonset pods
affinity: {}

service:
  deploy: true
  # -- Whether to setup service bindings
  type: NodePort
  # -- Name of service
  name: "http"
  # -- Port to bind and expose the service on
  port: 8000
  # -- The Target Port that the actual application is being exposed on
  targetPort: 80
  # -- Protocol that the service leverages (note: TCP or UDP)
  protocol: "TCP"

dockerconfigjson:
  # -- Name of the secret to use for the private repository
  name: "snowplow-sd-dockerhub"
  # -- Username for the private repository
  username: ""
  # -- Password for the private repository
  password: ""
  # -- Repository server URL
  server: "https://index.docker.io/v1/"
  # -- Email address for user of the private repository
  email: ""

cloudserviceaccount:
  # -- Whether to create a service-account
  deploy: false
  # -- Name of the service-account to create
  name: "snowplow-sd-service-account"
  aws:
    # -- IAM Role ARN to bind to the k8s service account
    roleARN: ""
  gcp:
    # -- Service Account email to bind to the k8s service account
    serviceAccount: ""
  azure:
    # -- Workload managed identity id to bind to the k8s service account
    managedIdentityId: ""

clusterrole:
  # -- Whether to create a cluster role
  deploy: false
  # -- List of PolicyRules to attach to cluster role
  rules: []
