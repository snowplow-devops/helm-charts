{{/*
Console M2M credentials for the Signals API observer (QA-1291).

Delivered as a Secret consumed via envFrom, so the key material never lands in
a rendered values file or a config map. The observer reads these three
variables by name; all three are required for it to mint a bearer token, and
without them it disables itself with a loud log line rather than failing the
run.
*/}}
{{- if .Values.observerSignals.enabled }}
{{- $c := .Values.observerSignals.credentials }}
{{- if and $c.orgId $c.apiKey $c.apiKeyId }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "avalanche.fullname" . }}-signals-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "snowplow.labels" . | nindent 4 }}
type: Opaque
stringData:
  SIGNALS_ORG_ID: {{ $c.orgId | quote }}
  SIGNALS_API_KEY: {{ $c.apiKey | quote }}
  SIGNALS_API_KEY_ID: {{ $c.apiKeyId | quote }}
{{- else }}
{{- fail "observerSignals.credentials.orgId, .apiKey and .apiKeyId are all required when observerSignals.enabled is true" }}
{{- end }}
{{- end }}
