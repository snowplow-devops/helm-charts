name: Lint and Test Charts

on: pull_request

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.8.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Add self
        run: helm repo add snowplow-devops https://snowplow-devops.github.io/helm-charts

      - name: Set up chart-testing
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0

      - name: Run chart-testing (list-changed)
        id: list-changed
        run: |
          changed=$(ct list-changed --target-branch ${{ github.event.repository.default_branch }})
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run chart-testing (lint)
        run: ct lint --target-branch ${{ github.event.repository.default_branch }} --config ct.yaml

      - name: Create kind cluster
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        if: steps.list-changed.outputs.changed == 'true'

      - name: Run chart-testing (install)
        run: ct install --target-branch  ${{ github.event.repository.default_branch }} --config ct.yaml

  schema:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.8.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Set up chart-testing
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0

      # Needed by `helm dependency build` in the fixture step
      - name: Add self
        run: helm repo add snowplow-devops https://snowplow-devops.github.io/helm-charts

      # Version must match SCHEMA_PLUGIN_VERSION in scripts/helm-schema-lib.sh
      - name: Install helm schema plugin
        run: helm plugin install https://github.com/losisin/helm-values-schema-json --version 2.6.0

      - name: Check values.schema.json is up to date
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: scripts/helm-schema-check.sh

      # Runs for every chart with tests/schema fixtures, not just changed ones:
      # it is only helm template, and a schema regression should be caught even
      # when the PR touches something else.
      - name: Validate schema fixtures
        run: scripts/helm-schema-test.sh

      # Pinned and checksum-verified. Keep on the same minor as the Kyverno
      # running in the clusters, so CEL behaviour matches what enforces.
      - name: Install kyverno CLI
        env:
          KYVERNO_VERSION: v1.19.1
          KYVERNO_SHA256: b38228f367fc0fdc2b08f4c83ea50ac5f16c60ff8d62d76a66157c33c47b70ae
        run: |
          tarball="kyverno-cli_${KYVERNO_VERSION}_linux_x86_64.tar.gz"
          curl -fsSLo "$tarball" "https://github.com/kyverno/kyverno/releases/download/${KYVERNO_VERSION}/${tarball}"
          echo "${KYVERNO_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" kyverno
          sudo install -m 0755 kyverno /usr/local/bin/kyverno
          kyverno version

      # Like the schema fixtures, runs every chart's suites rather than only
      # changed charts: it is only helm template plus the kyverno CLI.
      - name: Run Kyverno policy tests
        run: scripts/kyverno-policy-test.sh
